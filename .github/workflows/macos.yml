name: Build on macOS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        run: clang -std=c11 -Wall -Wextra -Wpedantic -g main.c csv_parser.c column.c cleanup.c stats.c report.c -o csvstat

      - name: Check help
        run: ./csvstat --help